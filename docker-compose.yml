services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: annual_reports
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ChromaDB ──────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:0.5.0
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
      IS_PERSISTENT: "TRUE"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # These override whatever is in .env — correct values for Docker networking
      DATABASE_URL: postgresql://postgres:password@db:5432/annual_reports
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_LOCAL_PATH: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    volumes:
      - uploads:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: on-failure

  # ── Celery worker ─────────────────────────────────────────────────────────
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/annual_reports
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_LOCAL_PATH: /app/chroma_db
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    restart: on-failure

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/annual_reports
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - worker
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: on-failure

  # ── Flower (Celery monitor) ───────────────────────────────────────────────
  flower:
    build: ./backend
    ports:
      - "5555:5555"
    env_file: ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - worker
    command: celery -A app.workers.celery_app flower --port=5555
    restart: on-failure

  # ── React frontend ────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
  chroma_data:
  uploads:
